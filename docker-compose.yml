services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: leadflow-n8n

    ports:
      - "5678:5678"

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=development
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata

    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/home/node/.n8n-files
      - ./n8n/workflows:/workflows

volumes:
  n8n_data: